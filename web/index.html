<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ParcelMerge | Delivery planner</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="brand">ParcelMerge</p>
      <h1>Delivery planner</h1>
      <p>Group parcels by destination and see how many warehouse round trips you can save.</p>
    </header>
    <div class="layout">
      <section class="panel" aria-labelledby="manifest-title">
        <h2 id="manifest-title">Parcel manifest</h2>
        <form id="planner">
          <label class="capacity">Vehicle capacity (kg)
            <input id="capacity" type="number" min="0.001" max="1000000000" step="0.001" value="5" required>
          </label>
          <div id="parcels"></div>
          <div class="actions">
            <button type="button" id="add">Add parcel</button>
            <button type="submit" class="primary">Calculate plan</button>
          </div>
        </form>
      </section>
      <section class="panel results" aria-labelledby="plan-title">
        <h2 id="plan-title">Delivery plan</h2>
        <p id="status" role="status">Calculate a plan to see routes and savings.</p>
        <div id="results"></div>
      </section>
    </div>
  </main>
  <template id="parcel-template">
    <fieldset class="parcel">
      <legend></legend>
      <label>Parcel ID<input name="id" type="number" min="1" max="2147483647" required></label>
      <label>Destination<select name="destination">
        <option>Sanjauli</option><option>Dhalli</option><option>Mall Road</option>
      </select></label>
      <label>Weight (kg)<input name="weight" type="number" min="0.001" max="1000000000" step="0.001" required></label>
      <label>Priority<select name="priority">
        <option value="1">Urgent</option><option value="2">Express</option><option value="3">Normal</option>
      </select></label>
      <button type="button" class="remove">Remove</button>
    </fieldset>
  </template>
</body>
</html>
